services:
  lab:
    build: .
    ports:
      # Publish only to the host loopback: reachable from your own machine only.
      # Keep the 127.0.0.1 prefix; do not change it to 0.0.0.0 or expose it.
      # (Inside the container the app listens on 0.0.0.0 via HOST so this
      # forwarded port reaches it; this line is what limits the exposure.)
      - "127.0.0.1:5000:5000"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW   # required by ping
    security_opt:
      - no-new-privileges:true
